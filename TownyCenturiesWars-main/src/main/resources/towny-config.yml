# TownyCenturiesWars - Towny Configuration Integration
# Это расширенный конфиг для интеграции TownyCenturiesWars с Towny

version:
  version: 0.103.2.0
  last_run_version: 0.103.2.0

language:
  language: en-US.yml
  enabled_languages: '*'

############################################################
# +------------------------------------------------------+ #
# |         TownyCenturiesWars Era Settings              | #
# +------------------------------------------------------+ #
############################################################

centuries:
  # Система эпох развития нации
  enabled: true
  
  # Режимы эпох
  modes:
    # Автоматический переход на следующую эпоху при выполнении условий
    auto_advance: false
    
    # Требуемое количество жителей для перехода на следующую эпоху
    residents_for_advance: 10
    
    # Требуемое количество участков для перехода на следующую эпоху
    plots_for_advance: 20
  
  # Ресурсы, необходимые для перехода между эпохами
  requirements:
    # Проверять требуемые ресурсы
    check_resources: true
    
    # Удалять ресурсы при переходе
    consume_resources: true
    
    # Хранилище ресурсов (сундуки нации/города)
    storage_type: "nation_bank"

wars:
  # Система войн между нациями
  enabled: true
  
  # Сражения
  battles:
    # Могут ли города воевать
    allow_town_wars: false
    
    # Только нации могут объявлять войну
    allow_nation_wars: true
    
    # Длительность войны по умолчанию (минуты)
    default_duration: 60
    
    # Минимальная длительность войны
    min_duration: 30
    
    # Максимальная длительность войны
    max_duration: 180
  
  # Правила сражений
  rules:
    # PvP включен во время войны
    force_pvp: true
    
    # Отслеживание убийств
    track_kills: true
    
    # Требуется минимальная эпоха для объявления войны
    min_century_to_declare: "RENAISSANCE"
  
  # Победа в войне
  victory:
    # Количество убийств для победы
    required_kills: 50
    
    # Нация может захватить города противника
    allow_conquest: true

armory:
  # Оружейная с оружием и амуницией
  enabled: true
  
  # Минимальная эпоха для доступа
  min_century_access: "RENAISSANCE"
  
  # Цены на оружие
  prices:
    crossbow: 5000
    diamond_helmet: 1000
    diamond_chestplate: 2500
    diamond_leggings: 2000
    diamond_boots: 1000
    tnt: 500
    snowball: 50
    slime_ball: 75

vehicles:
  # Система транспорта
  enabled: true
  
  # Минимальная эпоха для покупки
  min_century_access: "FLOURISH"
  
  # Цены на транспорт
  prices:
    tractor: 5000
    harvester: 8000
    locomotive: 10000
    freight_wagon: 3000
    passenger_wagon: 2500
    automobile: 15000
    motorcycle: 8000

